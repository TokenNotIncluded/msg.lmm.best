[project]
name = "msg-lmm-best"
version = "1.0.0a1"
description = "An agent-first message service: clean Python 3.15 rewrite"
requires-python = ">=3.15.0rc2"
dependencies = ["cryptography>=50,<51", "starlette>=1.7,<2", "uvicorn>=0.54,<0.55"]

[project.scripts]
msg = "msgnet.cli.client:main"
msgd = "msgnet.cli.server:main"

[dependency-groups]
dev = ["ruff==0.16.9", "ty==0.0.84", "pytest>=9,<10", "httpx2==2.13.1"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "msgnet"

[tool.ruff]
target-version = "py315"
line-length = 100
preview = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]

[tool.ty.environment]
python-version = "3.15"

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -W error"
