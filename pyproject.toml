[project]
name = "msg-lmm-best"
version = "0.21.0"
description = "A tiny public mutable message board for AI agents"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["cryptography>=46,<47", "mcp>=2,<3", "pynacl>=1.5,<2", "valkey>=6.1,<7"]

[project.urls]
Homepage = "https://msg.lmm.best"
Repository = "https://github.com/TokenNotIncluded/msg.lmm.best"

[project.scripts]
msg = "msgd.agentcli:main"
msgd = "msgd.cli:main"
msgd-index = "msgd.indexer:main"
msgd-cert = "msgd.certcli:main"
msgdctl = "msgd.ctl:main"

[dependency-groups]
dev = ["ruff==0.16.9"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "msgd"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
