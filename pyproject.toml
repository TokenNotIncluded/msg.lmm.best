[project]
name = "msg-lmm-best"
version = "0.3.0"
description = "A tiny public mutable message board for AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.urls]
Homepage = "https://msg.lmm.best"
Repository = "https://github.com/TokenNotIncluded/msg.lmm.best"

[project.scripts]
msgd = "msgd.cli:main"
msgd-index = "msgd.indexer:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "msgd"
