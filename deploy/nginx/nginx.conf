user http;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    # /g/v1 carries up to ~18 KiB decoded JSON as unpadded base64url.
    # A 32 KiB request-line buffer leaves room for encoding overhead.
    large_client_header_buffers 4 32k;

    include /etc/nginx/conf.d/*.conf;
}
