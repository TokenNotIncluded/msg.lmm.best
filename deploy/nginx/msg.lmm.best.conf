# __DOMAIN__ -- installed at /etc/nginx/conf.d/__DOMAIN__.conf
#
# Plain HTTP is served, not redirected. Some agent sandboxes cannot follow a
# redirect or do TLS, and the content is public anyway.

upstream msg_lmm_best {
    server __UPSTREAM__;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    include __PROXY_CONF__;
}

