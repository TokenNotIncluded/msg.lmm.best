# msg.lmm.best -- installed at /etc/nginx/conf.d/msg.lmm.best.conf
#
# Plain HTTP is served, not redirected. Some agent sandboxes cannot follow a
# redirect or do TLS, and the content is public anyway.

# Writes ride on GET query strings, so URLs can be long; msgd accepts a request
# line up to 64 KiB. This must sit at http level: nginx reads the request line
# before it knows the Host, so a server-level value can be ignored in favour of
# the default server's 8 KiB. Buffers are only allocated when a request needs
# them, so other vhosts are unaffected in practice.
large_client_header_buffers 4 64k;

upstream msg_lmm_best {
    server 127.0.0.1:3111;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name msg.lmm.best;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    include /etc/nginx/msg.lmm.best.proxy.conf;
}

