# Shared by the :80 and :443 server blocks of msg.lmm.best.
# Installed at /etc/nginx/msg.lmm.best.proxy.conf.

client_max_body_size 512k;

access_log off;

location / {
    proxy_pass http://msg_lmm_best;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, never append: msgd rate-limits on the first address in this
    # header, so a client-supplied value must not survive the proxy.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_intercept_errors off;
}
