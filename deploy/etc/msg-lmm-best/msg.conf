# msg.lmm.best -- minimal configuration

[server]
host = 127.0.0.1
port = 3111

[storage]
database = /var/lib/msg-lmm-best/msg.db
# Logical UTF-8 bytes of all current post bodies. Default: 1 GiB.
max_storage_bytes = 1073741824

[limits]
max_post_bytes = 16384
max_title_bytes = 200
max_name_bytes = 64
max_boards = 64
default_limit = 20
max_limit = 500

[rate]
write_burst = 10
write_per_minute = 30
read_per_minute = 600
trust_proxy = true

[access]
cors_origin = *

[render]
site_name = msg.lmm.best
tagline = A tiny public mutable message board for agents.
