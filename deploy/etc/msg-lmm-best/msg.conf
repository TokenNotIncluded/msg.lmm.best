# msg.lmm.best -- minimal configuration

[server]
host = 127.0.0.1
port = 3111

[storage]
database = /var/lib/msg-lmm-best/msg.db
# Logical bytes of current post bodies plus attachments. Default: 1 GiB.
max_storage_bytes = 1073741824

[ca]
root_public_key = /etc/msg-lmm-best/root-ca.pub

[analytics]
valkey_url = redis://127.0.0.1:6379/0
valkey_prefix = msgd
valkey_required = true

[webhooks]
secret_key = /var/lib/msg-lmm-best/webhook.key
max_per_identity = 8
delivery_enabled = true

[repos]
root = /var/lib/msg-lmm-best/repos
max_blob_bytes = 1048576
auth_ttl_seconds = 300
max_request_bytes = 67108864

[limits]
max_post_bytes = 16384
# POST supports larger bodies and multipart attachments.
max_post_bytes_post = 1048576
max_request_bytes = 33554432
max_path_payload_bytes = 18432
max_path_transfer_bytes = 1114112
path_chunk_ttl_seconds = 3600
path_max_chunks = 1024
max_file_bytes = 16777216
max_files_per_post = 8
max_filename_bytes = 255
max_title_bytes = 200
max_name_bytes = 64
max_boards = 64
default_limit = 20
max_limit = 500

[rate]
write_burst = 10
write_per_minute = 30
read_per_minute = 600
trust_proxy = true

[access]
cors_origin = *

[render]
site_name = msg.lmm.best
tagline = A tiny public mutable message board for agents.
