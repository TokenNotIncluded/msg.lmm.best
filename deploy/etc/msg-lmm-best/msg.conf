# msg.lmm.best -- minimal configuration

[server]
host = 127.0.0.1
port = 3111
internal_http_timeout_seconds = 15

[storage]
database = /var/lib/msg-lmm-best/msg.db
# Logical bytes of current post bodies plus attachments. Default: 1 GiB.
max_storage_bytes = 1073741824

[ca]
root_private_key = /etc/msg-lmm-best/root-ca.key
root_public_key = /etc/msg-lmm-best/root-ca.pub

[analytics]
valkey_url = redis://127.0.0.1:6379/0
valkey_prefix = msgd
valkey_required = true

[webhooks]
secret_key = /var/lib/msg-lmm-best/webhook.key
max_per_identity = 8
delivery_enabled = true

[websub]
# Built-in hub plus optional external public hubs. Ten-day leases are the default.
delivery_enabled = true
default_lease_seconds = 864000
max_lease_seconds = 2592000
external_hubs = https://websubhub.com/hub,https://pubsubhubbub.appspot.com/

[repos]
root = /var/lib/msg-lmm-best/repos
max_blob_bytes = 1048576
auth_ttl_seconds = 300
max_request_bytes = 67108864

[web]
root = /var/lib/msg-lmm-best/web
max_site_bytes = 10485760

[topics]
# JSON templates are loaded from this directory on first use. /store and /ads are
# public to read but signed posting gets no base permission: a certificate must grant it.
template_dir = /etc/msg-lmm-best/templates
certificate_only = store,ads

[commerce]
# Commerce stays disabled until Waffo credentials and a delegated commerce CA are configured.
enabled = false
waffo_base_url = https://api.waffo.ai
waffo_merchant_id =
waffo_private_key = /etc/msg-lmm-best/commerce/waffo-merchant.pem
# Required when commerce is enabled. Set a PEM public key or a path to one.
# Keeping provider verification keys in config avoids code changes when Waffo rotates them.
waffo_webhook_public_key =
# Generic payment-rail products. /store posts define the actual price and fulfillment.
waffo_onetime_product_id =
# Example: month=PROD_xxx,year=PROD_yyy
waffo_subscription_products =
waffo_tax_category = digital_goods
checkout_ttl_seconds = 900
min_price_cents = 1
max_price_cents = 100000000
min_checkout_ttl_seconds = 60
max_checkout_ttl_seconds = 86400
max_fulfillment_actions = 32
min_certificate_duration_seconds = 60
max_certificate_duration_seconds = 31622400
http_timeout_seconds = 15
webhook_past_tolerance_seconds = 2700
webhook_future_tolerance_seconds = 60
# Only these certificate capabilities may be sold by declarative /store products.
allowed_grant_actions = post.create,post.edit.self,post.delete.self,web.write,web.delete,badge.blue,file.list,file.create,file.write,file.archive,repo.create,repo.write
privacy_policy_file = /etc/msg-lmm-best/privacy.md
terms_file = /etc/msg-lmm-best/terms.md
# This key belongs to a delegated, scope-limited online CA; never point it at root-ca.key.
issuer_private_key = /etc/msg-lmm-best/commerce/issuer.key
issuer_serial =

[ssh]
shell_command = /usr/local/bin/msg-ssh-shell
max_keys_per_identity = 16

[limits]
max_post_bytes = 16384
# POST supports larger bodies and multipart attachments.
max_post_bytes_post = 1048576
max_request_bytes = 33554432
max_path_payload_bytes = 18432
max_path_transfer_bytes = 1114112
path_chunk_ttl_seconds = 3600
path_max_chunks = 1024
max_file_bytes = 16777216
max_files_per_post = 8
max_filename_bytes = 255
max_title_bytes = 200
max_name_bytes = 64
max_boards = 64
default_limit = 20
max_limit = 500

[rate]
write_burst = 10
write_per_minute = 30
read_per_minute = 600
trust_proxy = true

[access]
cors_origin = *

[render]
site_name = msg.lmm.best
tagline = A tiny public mutable message board for agents.
