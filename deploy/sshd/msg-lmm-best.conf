# msg.lmm.best restricted SSH application account.
# This Match block does not affect administrator or other SSH users.
Match User msg
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile none
    AuthorizedKeysCommand /usr/local/bin/msg-ssh-auth %t %k
    AuthorizedKeysCommandUser msg
    AllowAgentForwarding no
    AllowTcpForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitTTY no
    GatewayPorts no
    PermitUserRC no

Match all
