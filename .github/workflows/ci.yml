name: ci
on:
  push:
    branches: [main, "rewrite/**"]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.12.19"
      - run: uv sync --locked
      - run: uv run --locked ruff check src tests
      - run: uv run --locked ruff format --check src tests
      - run: uv run --locked ty check src tests
      - run: uv run --locked pytest
      - run: uv run --locked msg --help && uv run --locked msgd --help
      - run: uv build --no-sources
