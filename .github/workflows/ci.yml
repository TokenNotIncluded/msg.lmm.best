name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --all-groups
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run python -m unittest discover -s tests -q
      - run: uv run msgd-cert init-root --private-key /tmp/msgd-root.key --public-key /tmp/msgd-root.pub
      - run: uv run msgdctl --help >/dev/null
      - run: test -s /tmp/msgd-root.key && test -s /tmp/msgd-root.pub
      - run: cp /tmp/msgd-root.pub /tmp/msgd-root.before && uv run msgd-cert init-root --private-key /tmp/msgd-root.key --public-key /tmp/msgd-root.pub && cmp /tmp/msgd-root.before /tmp/msgd-root.pub
      - run: uv run python -m compileall -q src tests
      - run: bash -n deploy/deploy.sh deploy/update.sh
      - run: uv build --wheel --quiet
